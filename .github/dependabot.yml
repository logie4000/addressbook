# Dependabot opens a pull request each week for outdated dependencies.
# CI runs on each one; merge the ones that pass.
version: 2
updates:
- package-ecosystem: bundler
  directory: "/api"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10

- package-ecosystem: npm
  directory: "/client"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    # Angular's packages must move together, so update them in one PR.
    angular:
      patterns:
        - "@angular/*"
        - "@angular-devkit/*"
        - "@schematics/angular"
  ignore:
    # New major versions of Angular need `ng update` to migrate the code,
    # which Dependabot can't do. Upgrade those by hand.
    - dependency-name: "@angular/*"
      update-types: ["version-update:semver-major"]
    - dependency-name: "@angular-devkit/*"
      update-types: ["version-update:semver-major"]
    - dependency-name: "@schematics/angular"
      update-types: ["version-update:semver-major"]
    - dependency-name: "typescript"
      update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Tracks the Angular major version.
    - dependency-name: "angular-oauth2-oidc"
      update-types: ["version-update:semver-major"]

- package-ecosystem: docker
  directories:
    - "/api"
    - "/client"
  schedule:
    interval: weekly
  open-pull-requests-limit: 5

- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
