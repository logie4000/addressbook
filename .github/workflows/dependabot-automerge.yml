# Turns on GitHub auto-merge for Dependabot's minor and patch updates, so they
# merge by themselves once the required CI checks pass. Major updates, and
# Ruby version bumps (which must change .ruby-version and the Lambda image
# together), are left for a person to review.
#
# Needs two repository settings: "Allow auto-merge" (Settings > General) and a
# ruleset on main that requires the CI checks. Without the ruleset, auto-merge
# would merge straight away without waiting for CI.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          !contains(fromJSON('["ruby", "lambda/ruby"]'), steps.metadata.outputs.dependency-names)
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
