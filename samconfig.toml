# Defaults for `sam build` and `sam deploy`, so both work with no flags.
# See docs/deploy-aws.md.
version = 0.1

[default.global.parameters]
stack_name = "addressbook-production"

[default.build.parameters]
cached = true

[default.deploy.parameters]
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
resolve_image_repos = true
confirm_changeset = true
parameter_overrides = "StageName=\"production\" SecretKeyBaseParameter=\"/addressbook/production/SECRET_KEY_BASE\" DomainName=\"addressbook.specialbrew.net\" CertificateArn=\"arn:aws:acm:us-east-1:470114120012:certificate/d9f6772e-6387-4083-9dcb-92af16878e29\" GoogleClientId=\"914159640131-p7v9f3rahq2ddrt695ejd8cho6sl30es.apps.googleusercontent.com\""
