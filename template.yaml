AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Address Book: the Angular site in S3 behind CloudFront, and the Rails API
  running in AWS Lambda behind an API Gateway HTTP API, storing its data in
  two DynamoDB tables. CloudFront serves both on one domain: /api/* goes to
  the API and everything else to the site.

# Everything here is pay-per-use. With no traffic it costs nothing apart from
# a few cents a month to store the container image in ECR and the site in S3.

Parameters:
  StageName:
    Type: String
    Default: production
    AllowedPattern: "[a-z0-9-]+"
    Description: >
      Name of this deployment. Used in resource names, so separate stages
      (e.g. "production" and "staging") get separate tables.

  SecretKeyBaseParameter:
    Type: String
    Default: /addressbook/production/SECRET_KEY_BASE
    Description: >
      SSM Parameter Store SecureString holding Rails' secret_key_base. Create it
      once before the first deploy (see docs/deploy-aws.md).

  DomainName:
    Type: String
    Default: ""
    Description: >
      Optional custom domain for the site, e.g. addressbook.example.com. Needs
      CertificateArn too. Leave empty to use the CloudFront domain only.

  CertificateArn:
    Type: String
    Default: ""
    Description: >
      ARN of a validated ACM certificate for DomainName. CloudFront requires
      the certificate to be in us-east-1.

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024

Resources:
  # --- Data ------------------------------------------------------------------

  # Table names must match what Dynamoid expects: "<prefix>_<model table>",
  # with the prefix passed to the function as DYNAMODB_TABLE_PREFIX.
  PeopleTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub addressbook_${StageName}_people
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: parent_id
          AttributeType: S
        - AttributeName: address_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: parent_id-index
          KeySchema:
            - AttributeName: parent_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: address_id-index
          KeySchema:
            - AttributeName: address_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AddressesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub addressbook_${StageName}_addresses
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # --- API -------------------------------------------------------------------

  # HTTP API: API Gateway's cheaper, simpler flavor. Every request goes to the
  # Rails function, which does its own routing. Requests must carry a valid
  # Cognito access token, except the /up health check.
  #
  # These are plain API Gateway resources rather than a SAM HttpApi with
  # function events: the authorizer needs the Cognito app client, the app
  # client needs CloudFront's domain for its sign-in redirect, and CloudFront
  # needs the API, which SAM's all-in-one HttpApi would turn into a cycle.
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub addressbook-api-${StageName}
      ProtocolType: HTTP

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  ApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref Api
      Name: cognito
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
        Audience:
          - !Ref UserPoolClient

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: ANY /{proxy+}
      AuthorizationType: JWT
      AuthorizerId: !Ref ApiAuthorizer
      Target: !Sub integrations/${ApiIntegration}

  HealthCheckRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /up
      AuthorizationType: NONE
      Target: !Sub integrations/${ApiIntegration}

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*

  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ./api
      Dockerfile: Dockerfile.lambda
      DockerTag: ruby3.4
    Properties:
      FunctionName: !Sub addressbook-api-${StageName}
      PackageType: Image
      Architectures:
        - x86_64
      Environment:
        Variables:
          RAILS_ENV: production
          RAILS_LOG_LEVEL: info
          DYNAMODB_TABLE_PREFIX: !Sub addressbook_${StageName}
          SECRET_KEY_BASE_PARAMETER: !Ref SecretKeyBaseParameter
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PeopleTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AddressesTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretKeyBaseParameter}

  # Keep logs for two weeks instead of forever, so storage never piles up.
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/addressbook-api-${StageName}
      RetentionInDays: 14

  # --- Website -----------------------------------------------------------------

  # Private bucket holding the built Angular files. Only CloudFront can read
  # it (see SiteBucketPolicy). Retained on delete because CloudFormation can't
  # delete a bucket that still has files in it.
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub addressbook-${StageName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The Angular app does its own routing, so a deep link such as
  # /people/<id> must load index.html. Paths with a file extension
  # (main-ABC123.js, favicon.png) are left alone.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub addressbook-${StageName}-spa-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for Angular routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var lastSegment = request.uri.split('/').pop();
          if (lastSegment.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub Address Book (${StageName})
        Aliases: !If [HasCustomDomain, [!Ref DomainName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        # Edge locations in North America and Europe only: the cheapest tier.
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub ${Api}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed policy "CachingOptimized"
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed policies "CachingDisabled" and
            # "AllViewerExceptHostHeader": never cache API responses, and pass
            # along everything except Host (API Gateway needs its own).
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # --- Sign-in ---------------------------------------------------------------

  # Who may use the address book. Only an administrator can create accounts
  # (no public sign-up); people sign in with their email address. The Lite
  # tier is free for up to 10,000 monthly active users. Retained on delete so
  # the accounts aren't lost with the stack.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub addressbook-${StageName}
      UserPoolTier: LITE
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7

  # Cognito's hosted sign-in page lives at
  # https://addressbook-<stage>-<account id>.auth.<region>.amazoncognito.com
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub addressbook-${StageName}-${AWS::AccountId}
      ManagedLoginVersion: 1

  # The Angular app. It's a public client (no secret, since anything in a
  # browser is visible), using the authorization code flow with PKCE.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub addressbook-web-${StageName}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs: !If
        - HasCustomDomain
        - [!Sub "https://${DomainName}/", !Sub "https://${Distribution.DomainName}/"]
        - [!Sub "https://${Distribution.DomainName}/"]
      LogoutURLs: !If
        - HasCustomDomain
        - [!Sub "https://${DomainName}/", !Sub "https://${Distribution.DomainName}/"]
        - [!Sub "https://${Distribution.DomainName}/"]
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

Outputs:
  SiteUrl:
    Description: The address book website
    Value: !If
      - HasCustomDomain
      - !Sub https://${DomainName}
      - !Sub https://${Distribution.DomainName}
  DistributionDomainName:
    Description: Point your domain's CNAME record here
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Description: Used by scripts/deploy-site.sh to clear CloudFront's cache
    Value: !Ref Distribution
  SiteBucketName:
    Description: Used by scripts/deploy-site.sh to upload the site
    Value: !Ref SiteBucket
  ApiUrl:
    Description: Base URL of the API (also reachable through SiteUrl). Try <ApiUrl>/up.
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Description: Cognito user pool. Create accounts here (see docs/deploy-aws.md).
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Used by scripts/deploy-site.sh to configure sign-in
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Host of the hosted sign-in page
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  ApiFunctionName:
    Description: Lambda function running Rails
    Value: !Ref ApiFunction
  PeopleTableName:
    Value: !Ref PeopleTable
  AddressesTableName:
    Value: !Ref AddressesTable
