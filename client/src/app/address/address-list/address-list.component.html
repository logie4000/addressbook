<table>
  <thead>
    <th>Name(s)</th>
    <th>Street Address</th>
    <th>City, State Zip</th>
  </thead>
  <tbody>
    @for(address of itemList(); track address) {
      <tr (click)="onRowClick(address)">
        <td>{{ getResident(address) }}</td>
        <td>{{ getStreetAddress(address) }}</td>
        <td>{{ getCityStateZip(address) }}</td>
      </tr>
    }
  </tbody>
</table>
