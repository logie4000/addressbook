<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Spouse</th>
      <th>Street</th>
      <th>Street</th>
      <th>City</th>
      <th>State</th>
      <th>Zip</th>
      <th>Children</th>
      <th colspan="3"></th>
    </tr>
  </thead>

  <tbody>
    @for (person of itemList(); track person) {
      <td>{{ person.lastName }}</td>
      <td>&nbsp;</td>
      <td>{{ person.address?.street1 }}</td>
      <td>{{ person.address?.street2 }}</td>
      <td>{{ person.address?.city }}</td>
      <td>{{ person.address?.state }}</td>
      <td>{{ person.address?.zip }}</td>
      <td>&nbsp;</td>
    }
  </tbody>
</table>
