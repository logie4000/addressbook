<div class="row-list people" role="list">
  <div class="row-list-header" aria-hidden="true">
    <span>Name</span>
    <span>Street address</span>
    <span>City, State ZIP</span>
  </div>
  @for (person of sorted(); track person.id) {
    <a class="row" role="listitem" [routerLink]="getUrl(person)" routerLinkActive="selected" [ariaCurrentWhenActive]="true">
      <span class="name">{{ getListName(person) }}</span>
      <span class="street">{{ getStreetAddress(person) }}</span>
      <span class="city">{{ getCityStateZip(person) }}</span>
    </a>
  } @empty {
    <p class="empty">No people yet.</p>
  }
</div>
