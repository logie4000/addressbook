@if (auth.error) {
  <div class="sign-in-error" role="alert">
    <p>You couldn't be signed in: {{ auth.error }}</p>
    <button type="button" (click)="auth.startSignIn()">Try another account</button>
  </div>
} @else {
  <header class="titlebar">
    <a class="app-title" routerLink="/addresses">{{ title }}</a>
    @if (auth.enabled) {
      <div class="session">
        <span class="email">{{ auth.email }}</span>
        <button type="button" class="sign-out" title="Sign out" aria-label="Sign out" (click)="auth.signOut()"><app-icon name="sign-out" /></button>
      </div>
    }
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Main">
      <a routerLink="/addresses" routerLinkActive="active" ariaCurrentWhenActive="page">Addresses</a>
      <a routerLink="/people" routerLinkActive="active" ariaCurrentWhenActive="page">People</a>
    </nav>

    <main class="content">
      <router-outlet />
    </main>
  </div>
}
