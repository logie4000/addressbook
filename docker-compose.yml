include:
  - db-service.yml

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.production
    image: "address_book.api:latest"
    ports:
      - "8283:80"
    networks:
      - teapothill
    env_file:
      - path: "./config/.address_book.env"
        required: true
    environment:
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
    depends_on:
     db:
       condition: service_healthy

  client:
    build: 
      context: ./client
      dockerfile: Dockerfile
    image: "address_book.client:latest"
    ports:
      - "8280:80"
    networks: 
      - teapothill
    depends_on:
      - db

volumes:
  teapothill_volume:
    external: true

networks:
  teapothill:
    external: true
