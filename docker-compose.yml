services:
  # Local stand-in for Amazon DynamoDB. Data is kept in the
  # addressbook_dynamodb volume between restarts.
  dynamodb:
    image: "amazon/dynamodb-local:2.6.1"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    user: root
    volumes:
      - "addressbook_dynamodb:/home/dynamodblocal/data"
    ports:
      - "8000:8000"
    networks:
      - teapothill

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.production
    image: "address_book.api:latest"
    ports:
      - "8283:80"
    networks:
      - teapothill
    env_file:
      - path: "./config/.address_book.env"
        required: true
    environment:
      - RAILS_MASTER_KEY=${RAILS_MASTER_KEY}
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
    depends_on:
      - dynamodb

  client:
    build: 
      context: ./client
      dockerfile: Dockerfile
    image: "address_book.client:latest"
    ports:
      - "8280:80"
    networks: 
      - teapothill
    depends_on:
      - api

volumes:
  addressbook_dynamodb:

networks:
  teapothill:
    external: true
